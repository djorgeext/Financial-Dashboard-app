<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard - Enhanced</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: linear-gradient(135deg, #0f172a 0%, #1a2540 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #334155; padding-bottom: 20px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; background: linear-gradient(135deg, #06b6d4, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header p { color: #94a3b8; font-size: 0.95em; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 15px 20px; background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; border-radius: 8px; }
        .status-item { display: flex; align-items: center; gap: 10px; }
        .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; margin-bottom: 25px; align-items: end; }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-size: 0.85em; color: #94a3b8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        .control-group select, .control-group input { padding: 10px 12px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: #e2e8f0; }
        .run-button { padding: 10px 20px; background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .run-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3); }
        .section { background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 25px; margin-bottom: 25px; }
        .section-title { font-size: 1.3em; font-weight: 600; margin-bottom: 20px; color: #f1f5f9; }
        #chartContainer { width: 100%; height: 450px; border-radius: 8px; background: rgba(15, 23, 42, 0.5); }
        .error-message { background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; color: #fca5a5; padding: 15px; margin-bottom: 20px; }
        .no-data { text-align: center; padding: 40px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Financial Dashboard</h1>
            <p>Real-time forecasts, options analysis, and sentiment insights</p>
        </div>
        <div class="status-bar">
            <div><span>System Status: <strong>Operational</strong></span></div>
            <div id="lastUpdate"><span>Last updated: <strong>--:--</strong></span></div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="sectorSelect">Sector</label>
                <select id="sectorSelect"><option>Loading...</option></select>
            </div>
            <div class="control-group">
                <label for="tickerSelect">Ticker</label>
                <select id="tickerSelect"><option>Select sector</option></select>
            </div>
            <div class="control-group">
                <label>Granularity</label>
                <select><option>Hourly</option></select>
            </div>
            <button class="run-button" id="runButton">▶ Run Analysis</button>
        </div>
        <div id="errorContainer"></div>
        <div class="section">
            <div class="section-title">📈 Price Chart - OHLC & Forecast</div>
            <div id="chartContainer"></div>
        </div>
        <div class="section">
            <div class="section-title">💰 Suggested Options to Trade</div>
            <div id="optionsContainer"><div class="no-data">Select a ticker and run analysis</div></div>
        </div>
        <div class="section">
            <div class="section-title">📰 News Sentiment Analysis</div>
            <div id="newsContainer"><div class="no-data">Select a ticker and run analysis</div></div>
        </div>
    </div>
    <script>
        const API_BASE = '/api';
        let state = { sectors: {}, currentTicker: null, forecastData: null };
        addEventListener('DOMContentLoaded', initializeDashboard);
        async function initializeDashboard() {
            try {
                const r = await fetch(API_BASE + '/forecast/tickers-with-models');
                const data = await r.json();
                state.sectors = data.sectors;
                const sectors = Object.keys(state.sectors);
                const sel = document.getElementById('sectorSelect');
                sel.innerHTML = '';
                sectors.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = state.sectors[s].display_name;
                    sel.appendChild(opt);
                });
                sel.addEventListener('change', changeSector);
                document.getElementById('runButton').addEventListener('click', runAnalysis);
            } catch(e) { console.error('Init error:', e); }
        }
        function changeSector() {
            const s = document.getElementById('sectorSelect').value;
            const tickers = state.sectors[s]?.tickers || [];
            const sel = document.getElementById('tickerSelect');
            sel.innerHTML = '';
            tickers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                sel.appendChild(opt);
            });
        }
        async function parseJsonSafe(response) {
            try {
                return await response.json();
            } catch (e) {
                return null;
            }
        }
        function getApiErrorMessage(payload, fallback) {
            if (payload && typeof payload === 'object' && payload.error) {
                return payload.error;
            }
            return fallback;
        }
        async function runAnalysis() {
            const t = document.getElementById('tickerSelect').value;
            if (!t) return;
            const btn = document.getElementById('runButton');
            const errorContainer = document.getElementById('errorContainer');
            btn.disabled = true;
            errorContainer.innerHTML = '';
            state.currentTicker = t;
            try {
                const fr = await fetch(API_BASE + '/forecast/hourly/' + t);
                const fd = await parseJsonSafe(fr);
                if (!fr.ok) {
                    throw new Error(getApiErrorMessage(fd, 'Forecast request failed'));
                }
                if (!fd || typeof fd !== 'object' || fd.error) {
                    throw new Error(getApiErrorMessage(fd, 'Invalid forecast response'));
                }
                state.forecastData = fd;
                drawChart();

                const or = await fetch(API_BASE + '/options/' + t);
                const od = await parseJsonSafe(or);
                if (!or.ok) {
                    throw new Error(getApiErrorMessage(od, 'Options request failed'));
                }
                if (!od || typeof od !== 'object' || od.error) {
                    throw new Error(getApiErrorMessage(od, 'Invalid options response'));
                }
                drawOptions(od);

                const nr = await fetch(API_BASE + '/news/ticker/' + t);
                const nd = await parseJsonSafe(nr);
                if (!nr.ok) {
                    throw new Error(getApiErrorMessage(nd, 'News request failed'));
                }
                if (!nd || typeof nd !== 'object' || nd.error) {
                    throw new Error(getApiErrorMessage(nd, 'Invalid news response'));
                }
                drawNews(nd);
            } catch(e) {
                errorContainer.innerHTML = '<div class="error-message">Error: ' + e.message + '</div>';
            } finally {
                btn.disabled = false;
            }
        }
        function drawChart() {
            if (!state.forecastData?.last_40_hours) return;
            const h = state.forecastData.last_40_hours;
            const f = state.forecastData.forecast_10_hours || [];
            const cd = { x: h.map(x=>x.timestamp), open: h.map(x=>x.open), high: h.map(x=>x.high), low: h.map(x=>x.low), close: h.map(x=>x.close), type: 'candlestick', name: 'Historical' };
            const fd = { x: f.map(x=>x.timestamp), y: f.map(x=>x.forecast), type: 'scatter', mode: 'lines', name: 'Forecast', line: {color: '#06b6d4'} };
            const layout = { title: state.currentTicker + ' - OHLC & Forecast', template: 'plotly_dark', paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(30, 41, 59, 0.3)', font: {color: '#cbd5e1'} };
            Plotly.newPlot('chartContainer', [cd, fd], layout, {responsive: true});
        }
        function drawOptions(d) {
            if (!d.suggested_options?.length) { document.getElementById('optionsContainer').innerHTML = '<div class="no-data">No options</div>'; return; }
            let html = '<table style="width:100%;border-collapse:collapse"><tr><th>Type</th><th>Strike</th><th>Exp</th><th>Rec</th><th>Prob</th></tr>';
            d.suggested_options.forEach(o => {
                html += '<tr><td>' + o.option_type + '</td><td>' + (o.strike || o.call_strike) + '</td><td>' + o.expiration + '</td><td>' + o.recommendation + '</td><td>' + Math.round(o.probability * 100) + '%</td></tr>';
            });
            html += '</table>';
            document.getElementById('optionsContainer').innerHTML = html;
        }
        function drawNews(d) {
            if (!d || typeof d !== 'object' || d.error) { document.getElementById('newsContainer').innerHTML = '<div class="no-data">No news</div>'; return; }
            const ticker = d.ticker || 'N/A';
            const sentiment = d.sentiment || 'neutral';
            const score = typeof d.sentiment_score === 'number' ? Math.round(d.sentiment_score * 100) : 0;
            const summary = d.summary || 'No summary available';
            const html = '<div><strong>' + ticker + '</strong> | ' + sentiment + ' | ' + score + '%<br>' + summary + '</div>';
            document.getElementById('newsContainer').innerHTML = html;
        }
    </script>
</body>
</html>
