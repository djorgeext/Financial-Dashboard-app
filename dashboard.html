<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard - Enhanced</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: linear-gradient(135deg, #0f172a 0%, #1a2540 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #334155; padding-bottom: 20px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; background: linear-gradient(135deg, #06b6d4, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header p { color: #94a3b8; font-size: 0.95em; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 15px 20px; background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; border-radius: 8px; }
        .status-item { display: flex; align-items: center; gap: 10px; }
        .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; margin-bottom: 25px; align-items: end; }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-size: 0.85em; color: #94a3b8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        .control-group select, .control-group input { padding: 10px 12px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: #e2e8f0; }
        .run-button { padding: 10px 20px; background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .run-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3); }
        .section { background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 25px; margin-bottom: 25px; }
        .section-title { font-size: 1.3em; font-weight: 600; margin-bottom: 20px; color: #f1f5f9; }
        #chartContainer { width: 100%; height: 450px; border-radius: 8px; background: rgba(15, 23, 42, 0.5); }
        .error-message { background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; color: #fca5a5; padding: 15px; margin-bottom: 20px; }
        .no-data { text-align: center; padding: 40px; color: #94a3b8; }
        .table-wrap { overflow-x: auto; }
        .results-table { width: 100%; border-collapse: collapse; min-width: 1250px; }
        .results-table th, .results-table td { border-bottom: 1px solid #334155; padding: 8px 10px; text-align: left; font-size: 0.84rem; }
        .results-table th { color: #bfdbfe; background: rgba(15, 23, 42, 0.7); position: sticky; top: 0; }
        .news-list { margin-top: 10px; }
        .news-item { margin-bottom: 8px; color: #cbd5e1; }
        @media (max-width: 900px) {
            .controls { grid-template-columns: 1fr; }
            #chartContainer { height: 360px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Financial Dashboard</h1>
            <p>Real-time forecasts, options analysis, and sentiment insights</p>
        </div>
        <div class="status-bar">
            <div><span>System Status: <strong>Operational</strong></span></div>
            <div id="lastUpdate"><span>Last updated: <strong>--:--</strong></span></div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="sectorSelect">Sector</label>
                <select id="sectorSelect"><option>Loading...</option></select>
            </div>
            <div class="control-group">
                <label for="tickerSelect">Ticker</label>
                <select id="tickerSelect"><option>Select sector</option></select>
            </div>
            <div class="control-group">
                <label>Granularity</label>
                <select><option>Hourly</option></select>
            </div>
            <button class="run-button" id="runButton">▶ Run Analysis</button>
        </div>
        <div id="errorContainer"></div>
        <div class="section">
            <div class="section-title">📈 Price Chart - OHLC & Forecast</div>
            <div id="chartContainer"></div>
        </div>
        <div class="section">
            <div class="section-title">💰 Suggested Options to Trade</div>
            <div id="optionsContainer"><div class="no-data">Select a ticker and run analysis</div></div>
        </div>
        <div class="section">
            <div class="section-title">📰 News Sentiment Analysis</div>
            <div id="newsContainer"><div class="no-data">Select a ticker and run analysis</div></div>
        </div>
    </div>
    <script>
        const API_BASE = '/api';
        let state = { sectors: {}, currentTicker: null, forecastData: null };
        addEventListener('DOMContentLoaded', initializeDashboard);
        async function initializeDashboard() {
            try {
                const r = await fetch(API_BASE + '/forecast/tickers-with-models');
                const data = await r.json();
                state.sectors = data.sectors;
                const sectors = Object.keys(state.sectors);
                const sel = document.getElementById('sectorSelect');
                sel.innerHTML = '';
                sectors.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = state.sectors[s].display_name;
                    sel.appendChild(opt);
                });
                sel.addEventListener('change', changeSector);
                document.getElementById('runButton').addEventListener('click', runAnalysis);
                changeSector();
            } catch(e) { console.error('Init error:', e); }
        }
        function changeSector() {
            const s = document.getElementById('sectorSelect').value;
            const tickers = state.sectors[s]?.tickers || [];
            const sel = document.getElementById('tickerSelect');
            sel.innerHTML = '';
            tickers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                sel.appendChild(opt);
            });
        }
        async function parseJsonSafe(response) {
            try {
                return await response.json();
            } catch (e) {
                return null;
            }
        }
        function getApiErrorMessage(payload, fallback) {
            if (payload && typeof payload === 'object' && payload.error) {
                return payload.error;
            }
            return fallback;
        }
        async function runAnalysis() {
            const t = document.getElementById('tickerSelect').value;
            if (!t) return;
            const btn = document.getElementById('runButton');
            const errorContainer = document.getElementById('errorContainer');
            btn.disabled = true;
            errorContainer.innerHTML = '';
            state.currentTicker = t;
            try {
                const fr = await fetch(API_BASE + '/forecast/hourly/' + t);
                const fd = await parseJsonSafe(fr);
                if (!fr.ok) {
                    throw new Error(getApiErrorMessage(fd, 'Forecast request failed'));
                }
                if (!fd || typeof fd !== 'object' || fd.error) {
                    throw new Error(getApiErrorMessage(fd, 'Invalid forecast response'));
                }
                state.forecastData = fd;
                drawChart();

                const or = await fetch(API_BASE + '/options/' + t);
                const od = await parseJsonSafe(or);
                if (!or.ok) {
                    throw new Error(getApiErrorMessage(od, 'Options request failed'));
                }
                if (!od || typeof od !== 'object' || od.error) {
                    throw new Error(getApiErrorMessage(od, 'Invalid options response'));
                }
                drawOptions(od);

                const nr = await fetch(API_BASE + '/news/ticker/' + t);
                const nd = await parseJsonSafe(nr);
                if (!nr.ok) {
                    throw new Error(getApiErrorMessage(nd, 'News request failed'));
                }
                if (!nd || typeof nd !== 'object' || nd.error) {
                    throw new Error(getApiErrorMessage(nd, 'Invalid news response'));
                }
                drawNews(nd);
                const formattedLastUpdate = lastUpdatedFormatter.format(new Date());
                document.getElementById('lastUpdate').innerHTML = '<span>Last updated: <strong>' + formattedLastUpdate + '</strong></span>';
            } catch(e) {
                errorContainer.innerHTML = '<div class="error-message">Error: ' + e.message + '</div>';
            } finally {
                btn.disabled = false;
            }
        }
        function parseChartTimestamp(value) {
            if (value instanceof Date && !Number.isNaN(value.getTime())) {
                return value;
            }

            if (typeof value === 'number') {
                const numericDate = new Date(value);
                if (!Number.isNaN(numericDate.getTime())) {
                    return numericDate;
                }
            }

            if (typeof value === 'string') {
                const trimmed = value.trim();
                if (!trimmed) {
                    return null;
                }

                const directDate = new Date(trimmed);
                if (!Number.isNaN(directDate.getTime())) {
                    return directDate;
                }

                if (trimmed.includes(' ') && !trimmed.includes('T')) {
                    const normalizedDate = new Date(trimmed.replace(' ', 'T'));
                    if (!Number.isNaN(normalizedDate.getTime())) {
                        return normalizedDate;
                    }
                }
            }

            return null;
        }
        const lastUpdatedFormatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/New_York',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });
        const chartTickFormatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/New_York',
            day: '2-digit',
            month: 'short',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
        function formatChartTickLabel(timestamp) {
            const date = parseChartTimestamp(timestamp);
            if (!date) {
                return '';
            }

            const parts = chartTickFormatter.formatToParts(date);
            const day = parts.find(p => p.type === 'day')?.value || '';
            const month = parts.find(p => p.type === 'month')?.value || '';
            const hour = parts.find(p => p.type === 'hour')?.value || '';
            const minute = parts.find(p => p.type === 'minute')?.value || '';

            return day + ' ' + month + '\n' + hour + ':' + minute;
        }
        function buildChartTickConfig(indexLabels, rangeStart, rangeEnd, targetTickCount) {
            if (!Array.isArray(indexLabels) || !indexLabels.length) {
                return { tickvals: [], ticktext: [] };
            }

            const minIndex = 0;
            const maxIndex = indexLabels.length - 1;

            const start = Number.isFinite(rangeStart)
                ? Math.max(minIndex, Math.floor(rangeStart))
                : minIndex;
            const end = Number.isFinite(rangeEnd)
                ? Math.min(maxIndex, Math.ceil(rangeEnd))
                : maxIndex;

            const safeEnd = end >= start ? end : start;
            const visibleCount = safeEnd - start + 1;
            const tickGoal = Math.max(2, Math.min(12, Number.isFinite(targetTickCount) ? Math.round(targetTickCount) : 4));
            const step = Math.max(1, Math.ceil((visibleCount - 1) / Math.max(1, tickGoal - 1)));
            const tickvals = [];

            for (let i = start; i <= safeEnd; i += step) {
                tickvals.push(i);
            }
            if (tickvals[tickvals.length - 1] !== safeEnd) {
                tickvals.push(safeEnd);
            }

            return {
                tickvals,
                ticktext: tickvals.map(index => indexLabels[index])
            };
        }
        function buildAdaptiveTickTarget(visibleCount) {
            if (!Number.isFinite(visibleCount) || visibleCount <= 0) {
                return 4;
            }

            return Math.min(12, Math.max(4, Math.round(20 / Math.sqrt(visibleCount))));
        }
        function drawChart() {
            if (!state.forecastData?.last_40_hours) return;
            const h = state.forecastData.last_40_hours;
            const f = state.forecastData.forecast_10_hours || [];

            const historicalPoints = h.map(point => {
                const timestamp = parseChartTimestamp(point.timestamp);
                const open = Number(point.open);
                const high = Number(point.high);
                const low = Number(point.low);
                const close = Number(point.close);

                if (
                    !timestamp
                    || !Number.isFinite(open)
                    || !Number.isFinite(high)
                    || !Number.isFinite(low)
                    || !Number.isFinite(close)
                ) {
                    return null;
                }

                return {
                    timestamp,
                    open,
                    high,
                    low,
                    close,
                    ohlcAvg: (open + high + low + close) / 4
                };
            }).filter(Boolean).sort((a, b) => a.timestamp - b.timestamp);

            const forecastPoints = f.map(point => {
                const timestamp = parseChartTimestamp(point.timestamp);
                const forecast = Number(point.forecast);

                if (!timestamp || !Number.isFinite(forecast)) {
                    return null;
                }

                return { timestamp, forecast };
            }).filter(Boolean).sort((a, b) => a.timestamp - b.timestamp);

            if (!historicalPoints.length) {
                return;
            }

            const historicalIndices = historicalPoints.map((_, index) => index);
            const forecastIndices = forecastPoints.map((_, index) => historicalPoints.length + index);
            const indexLabels = historicalPoints
                .map(point => formatChartTickLabel(point.timestamp))
                .concat(forecastPoints.map(point => formatChartTickLabel(point.timestamp)));
            const initialTickConfig = buildChartTickConfig(indexLabels, null, null, 4);

            const historical = {
                x: historicalIndices,
                open: historicalPoints.map(point => point.open),
                high: historicalPoints.map(point => point.high),
                low: historicalPoints.map(point => point.low),
                close: historicalPoints.map(point => point.close),
                type: 'candlestick',
                name: 'Historical',
                increasing: { line: { color: '#22c55e' } },
                decreasing: { line: { color: '#ef4444' } }
            };

            const historicalAvgLine = {
                x: historicalIndices,
                y: historicalPoints.map(point => point.ohlcAvg),
                type: 'scatter',
                mode: 'lines',
                name: 'OHLC Avg',
                connectgaps: true,
                line: { color: '#f8fafc', width: 2 }
            };

            const lastHistoricalPoint = historicalPoints[historicalPoints.length - 1];
            const lastHistoricalIndex = historicalPoints.length - 1;
            const forecastX = [lastHistoricalIndex].concat(forecastIndices);
            const forecastY = [lastHistoricalPoint.ohlcAvg].concat(forecastPoints.map(point => point.forecast));

            const forecastLine = {
                x: forecastX,
                y: forecastY,
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Forecast',
                connectgaps: true,
                line: { color: '#22d3ee', width: 2, dash: 'dash' }
            };
            const barrier = Number(state.forecastData?.barrier_hourly || 0);
            const allIndices = historicalIndices.concat(forecastIndices);
            const shapes = barrier > 0 ? [{
                type: 'line',
                xref: 'x',
                yref: 'y',
                x0: allIndices[0],
                x1: allIndices[allIndices.length - 1],
                y0: barrier,
                y1: barrier,
                line: { color: '#f59e0b', width: 1, dash: 'dot' }
            }] : [];

            const layout = {
                title: state.currentTicker + ' - OHLC & Forecast',
                template: 'plotly_dark',
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(30, 41, 59, 0.3)',
                font: { color: '#cbd5e1' },
                margin: { l: 45, r: 20, t: 45, b: 35 },
                xaxis: {
                    type: 'linear',
                    rangeslider: { visible: false },
                    tickmode: 'array',
                    tickvals: initialTickConfig.tickvals,
                    ticktext: initialTickConfig.ticktext
                },
                yaxis: { fixedrange: false },
                shapes
            };
            Plotly.newPlot('chartContainer', [historical, historicalAvgLine, forecastLine], layout, { responsive: true, displaylogo: false })
                .then(graph => {
                    graph.on('plotly_relayout', relayoutData => {
                        const hasExplicitRange = Object.prototype.hasOwnProperty.call(relayoutData || {}, 'xaxis.range[0]')
                            || Array.isArray(relayoutData?.['xaxis.range']);
                        const hasAutorange = relayoutData?.['xaxis.autorange'] === true;

                        if (!hasExplicitRange && !hasAutorange) {
                            return;
                        }

                        const range = Array.isArray(relayoutData?.['xaxis.range']) ? relayoutData['xaxis.range'] : null;
                        const rangeStart = Number(relayoutData?.['xaxis.range[0]'] ?? (range ? range[0] : Number.NaN));
                        const rangeEnd = Number(relayoutData?.['xaxis.range[1]'] ?? (range ? range[1] : Number.NaN));

                        const adaptiveTarget = Number.isFinite(rangeStart) && Number.isFinite(rangeEnd)
                            ? buildAdaptiveTickTarget(Math.abs(rangeEnd - rangeStart) + 1)
                            : 4;
                        const adaptiveTickConfig = buildChartTickConfig(indexLabels, rangeStart, rangeEnd, adaptiveTarget);

                        Plotly.relayout(graph, {
                            'xaxis.tickvals': adaptiveTickConfig.tickvals,
                            'xaxis.ticktext': adaptiveTickConfig.ticktext
                        });
                    });
                });
        }
        function drawOptions(d) {
            const container = document.getElementById('optionsContainer');
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }

            const rows = Array.isArray(d.table_rows) ? d.table_rows : [];
            const suggestedOptions = Array.isArray(d.suggested_options) ? d.suggested_options : [];
            if (!rows.length && !suggestedOptions.length) {
                const empty = document.createElement('div');
                empty.className = 'no-data';
                empty.textContent = 'No options for current market chain. Try another ticker.';
                container.appendChild(empty);
                return;
            }
            const usePrimaryRows = rows.length > 0;
            const columns = usePrimaryRows
                ? [
                    'Fecha', 'Sector', 'Ticker', 'Tipo', 'Precio Actual', 'Barrera', 'Barrera a 10 hrs',
                    'Vencimiento', 'Strike', 'Ask', 'IV', 'Prob. Mercado', 'Prob. Final (Bayes)', 'Sentimiento Score'
                ]
                : ['option_type', 'strike', 'expiration', 'ask', 'iv', 'market_probability', 'probability', 'recommendation'];
            const rowsToRender = usePrimaryRows ? rows : suggestedOptions;

            const tableWrap = document.createElement('div');
            tableWrap.className = 'table-wrap';

            const table = document.createElement('table');
            table.className = 'results-table';

            const headerRow = document.createElement('tr');
            columns.forEach(c => {
                const th = document.createElement('th');
                th.textContent = c;
                headerRow.appendChild(th);
            });
            table.appendChild(headerRow);

            rowsToRender.forEach(r => {
                const rowEl = document.createElement('tr');
                columns.forEach(c => {
                    const v = r[c];
                    const cell = document.createElement('td');
                    cell.textContent = v === undefined || v === null ? '-' : String(v);
                    rowEl.appendChild(cell);
                });
                table.appendChild(rowEl);
            });

            tableWrap.appendChild(table);
            container.appendChild(tableWrap);
        }
        function drawNews(d) {
            const container = document.getElementById('newsContainer');
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }

            if (!d || typeof d !== 'object' || d.error) {
                const empty = document.createElement('div');
                empty.className = 'no-data';
                empty.textContent = 'No news';
                container.appendChild(empty);
                return;
            }

            const ticker = d.ticker || 'N/A';
            const sentiment = d.sentiment || 'neutral';
            const score = typeof d.sentiment_score === 'number' ? Math.round(d.sentiment_score * 100) : 0;
            const summary = d.summary || 'No summary available';
            const signals = Array.isArray(d.key_signals) ? d.key_signals.slice(0, 4) : [];
            const topNews = Array.isArray(d.news_summaries) ? d.news_summaries.slice(0, 3) : [];

            const header = document.createElement('div');
            const strongTicker = document.createElement('strong');
            strongTicker.textContent = ticker;
            header.appendChild(strongTicker);
            header.appendChild(document.createTextNode(' | ' + sentiment + ' | ' + score + '%'));
            header.appendChild(document.createElement('br'));
            header.appendChild(document.createTextNode(summary));
            container.appendChild(header);

            if (signals.length) {
                const signalsDiv = document.createElement('div');
                signalsDiv.className = 'news-list';
                const signalsLabel = document.createElement('strong');
                signalsLabel.textContent = 'Signals:';
                signalsDiv.appendChild(signalsLabel);
                signalsDiv.appendChild(document.createTextNode(' ' + signals.map(s => String(s)).join(' | ')));
                container.appendChild(signalsDiv);
            }

            if (topNews.length) {
                const topNewsDiv = document.createElement('div');
                topNewsDiv.className = 'news-list';
                const topNewsLabel = document.createElement('strong');
                topNewsLabel.textContent = 'Top news:';
                topNewsDiv.appendChild(topNewsLabel);

                topNews.forEach(n => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'news-item';
                    itemDiv.textContent = '- ' + (n && n.title ? String(n.title) : 'Untitled');
                    topNewsDiv.appendChild(itemDiv);
                });

                container.appendChild(topNewsDiv);
            }
        }
    </script>
</body>
</html>
